name: generate animation

on:
  # запуск каждые 24 часа
  schedule:
    - cron: "0 */24 * * *"

  # запуск вручную через вкладку Actions
  workflow_dispatch:

  # запуск при пуше в main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # создаёт SVG-анимацию из графа коммитов пользователя arane1223
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: arane1223
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # публикует SVG в ветку output (для GitHub Pages)
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
